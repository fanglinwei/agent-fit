name: Publish npm package

on:
  release:
    types: [published]

jobs:
  publish:
    if: github.repository == 'fanglinwei/agent-fit' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@fanglinwei'
      - name: Verify release version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF_NAME" != "v$version" || "$(< VERSION)" != "$version" ]]; then
            echo "::error::The release tag must be v$version and VERSION must contain $version."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
